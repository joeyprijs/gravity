name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Unit and data-integrity tests
        run: npm test
      - name: Manifest is in sync with the data tree
        run: node scripts/generate-manifest.js --check
      - name: Data files are in canonical expanded form
        run: node scripts/format-data.js --check
      - name: Narration scripts match the authored prose
        run: node scripts/generate-narration-script.js --check
      # The DOM half of the suite. Node can't import engine.js (no window), so
      # without this everything UI-side is unprotected in CI.
      - name: Browser smoke test
        run: scripts/run-smoke.sh
