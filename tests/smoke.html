<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- Everything (engine fetches, plugin imports, stylesheet) resolves
       against the repo root, exactly as it does for index.html. -->
  <base href="../">
  <title>Gravity smoke test</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* The results panel floats above the live game so a failing step can be
       inspected in place. */
    #smoke-results {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 9999;
      max-width: 420px;
      max-height: 60vh;
      overflow-y: auto;
      padding: 12px 16px;
      background: rgba(10, 10, 12, 0.95);
      border: 1px solid #444;
      font: 12px/1.5 monospace;
      color: #ddd;
      white-space: pre-wrap;
    }

    #smoke-results .pass { color: #7dd87d; }
    #smoke-results .fail { color: #ff7d7d; font-weight: bold; }
  </style>
</head>

<body>
  <div id="smoke-results">smoke: booting…</div>

  <script type="module">
    // Gravity UI smoke test — zero dependencies, runs in a real browser.
    //
    //   python3 -m http.server 3000   →   open /tests/smoke.html
    //
    // It boots the real engine against the shipped demo data, drives the UI
    // like a player, and asserts the surfaces the Node tests can't reach
    // (they have no DOM). Results render in the corner panel;
    // `window.__SMOKE__` and the document title carry the verdict for
    // automation.
    import { RPGEngine } from './src/core/engine.js';

    // Set synchronously, before any await: the engine's DOMContentLoaded
    // listener may fire mid-module (the event doesn't wait for top-level
    // await), and it must not boot an engine against the not-yet-injected
    // skeleton.
    window.GRAVITY_MANUAL_BOOT = true;

    // ── Harness ────────────────────────────────────────────────────────────
    const results = [];
    const errors = [];
    window.addEventListener('error', (e) => errors.push(e.message));
    window.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));

    const assert = (cond, message) => {
      if (!cond) throw new Error(message);
    };
    const until = (cond, what, timeout = 5000) => new Promise((resolve, reject) => {
      const t0 = performance.now();
      (function poll() {
        let value;
        try { value = cond(); } catch { /* not ready yet */ }
        if (value) return resolve(value);
        if (performance.now() - t0 > timeout) return reject(new Error(`timed out waiting for ${what}`));
        setTimeout(poll, 50);
      })();
    });
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => [...document.querySelectorAll(sel)];
    const text = (el) => (el?.textContent ?? '').replace(/\s+/g, ' ').trim();

    async function step(name, fn) {
      try {
        await fn();
        results.push({ name, ok: true });
      } catch (err) {
        results.push({ name, ok: false, error: err.message });
      }
      report(false);
    }

    function report(done) {
      const failed = results.filter(r => !r.ok);
      const panel = document.getElementById('smoke-results');
      panel.innerHTML = results.map(r =>
        `<div class="${r.ok ? 'pass' : 'fail'}">${r.ok ? '✓' : '✗'} ${r.name}${r.ok ? '' : ` — ${r.error}`}</div>`
      ).join('') + (done ? `<div class="${failed.length ? 'fail' : 'pass'}">— ${results.length - failed.length}/${results.length} passed —</div>` : '');
      if (done) {
        document.title = failed.length ? `SMOKE: FAIL (${failed.length})` : `SMOKE: PASS (${results.length})`;
        window.__SMOKE__ = { done: true, passed: results.length - failed.length, failed: failed.length, results };
        // Which steps failed, in the URL. A headless runner can read the title
        // and the URL of a target over Chrome's plain-HTTP DevTools endpoint —
        // so scripts/run-smoke.sh can name the broken step in CI output without
        // a WebSocket client to reach into the page.
        if (failed.length) location.hash = `failed=${encodeURIComponent(failed.map(r => r.name).join(' | '))}`;
      }
    }

    // ── Boot the real game ─────────────────────────────────────────────────
    // Section collapse state is in-memory only, but builds that predate that
    // persisted it under these keys — clear leftovers so the 'never persisted'
    // step below proves the current code writes nothing, not that the profile
    // happens to be clean.
    localStorage.removeItem('gravity:sheet-collapsed');
    localStorage.removeItem('gravity:inventory-collapsed');

    // The DOM skeleton comes from index.html itself — one source of truth,
    // so this page can't drift from the markup the engine actually targets.
    const indexHtml = await fetch('index.html').then(r => r.text());
    const indexDoc = new DOMParser().parseFromString(indexHtml, 'text/html');
    for (const id of ['char-creation', 'file-upload', 'game-container']) {
      const node = indexDoc.getElementById(id);
      assert(node, `index.html is missing #${id}`);
      document.body.appendChild(document.importNode(node, true));
    }

    // Construct the engine directly — the skeleton above was injected after
    // DOMContentLoaded, so the production boot listener can't fire here (it
    // guards against double-boot for exactly this case).
    window.gameEngine = new RPGEngine();

    // ── The suite ──────────────────────────────────────────────────────────
    queueMicrotask(async () => {
      await step('engine boots to character creation', async () => {
        await until(() => window.gameEngine, 'engine construction');
        await until(() => !$('#char-creation').hidden && $('#char-creation').children.length, 'char-creation screen');
      });

      await step('character creation confirms into the game', async () => {
        const nameInput = $('#char-creation input[type="text"]');
        assert(nameInput, 'name input exists');
        nameInput.value = 'Smoke Tester';
        const confirm = $('.char-creation__confirm-btn');
        assert(confirm, 'confirm button exists');
        confirm.click();
        await until(() => !$('#game-container').hidden, 'game container to show');
      });

      await step('tabs build from rules, in rules order, with the map active', () => {
        const tabs = $$('.tabs__nav button');
        assert(tabs.length === 5, `expected 5 tabs, got ${tabs.length}`);
        assert(tabs.map(t => text(t)).join() === 'Map,Sheet,Inventory,Quests,Options',
          `tabs read "${tabs.map(t => text(t)).join()}"`);
        assert(tabs[0].classList.contains('tabs__btn--active'), 'the map tab starts active');
        assert(tabs.every(t => t.querySelector('svg.icon')), 'every tab renders its rules.tabs[].icon');
        assert(!$('#map-tab').hidden, 'map panel visible');
        assert($('#attributes-tab').hidden && $('#inventory-tab').hidden, 'the rest are hidden');
      });

      await step('sheet sections start collapsed', () => {
        assert($('[data-section-body="character"]').hidden, 'character body starts hidden');
        assert($('[data-section-body="skills"]').hidden, 'skills body starts hidden');
      });

      await step('character section: rows, plugin row, bound values', () => {
        const rows = $$('[data-section-body="character"] .attr-list__row');
        const labels = rows.map(r => text(r.querySelector('.attr-list__label')));
        const expected = ['Name', 'Level', 'Hit Points', 'Armor Class', 'Initiative', 'Action Points', 'Luck Points', 'Gold', 'Reputation'];
        assert(JSON.stringify(labels) === JSON.stringify(expected),
          `row labels ${JSON.stringify(labels)}`);
        const value = (label) => text(rows[labels.indexOf(label)].querySelector('.attr-list__value'));
        assert(value('Name') === 'Smoke Tester', `name row shows "${value('Name')}"`);
        assert(value('Hit Points') === '10/10', `HP row shows "${value('Hit Points')}"`);
        assert(value('Reputation') === '0', `reputation row shows "${value('Reputation')}"`);
        // Level-up point-buy covers the char-creation stats: HP, AC, and
        // Initiative rows carry spend buttons (hidden until points are banked).
        assert($('[data-spend-attr="resources.hp.max"]'), 'HP row has a spend button');
        assert($('[data-spend-attr="attributes.ac"]'), 'AC row has a spend button');
        assert($('[data-spend-attr="attributes.initiative"]'), 'Initiative row has a spend button');
        // Every row is marked, including the plugin's (registerSheetRow icon).
        assert(rows.every(r => r.querySelector('.attr-list__label svg.icon')), 'every character row shows an icon');
      });

      await step('skills section lists the custom attributes', () => {
        const rows = $$('[data-section-body="skills"] .attr-list__row');
        const labels = rows.map(r => text(r.querySelector('.attr-list__label')));
        assert(JSON.stringify(labels) === JSON.stringify(['Strength', 'Intelligence', 'Perception', 'Stealth', 'Charisma', 'Luck']),
          `skill labels ${JSON.stringify(labels)}`);
        assert(rows.every(r => r.querySelector('.attr-list__label svg.icon')), 'every skill row shows its rules.customAttributes[].icon');
      });

      await step('section headings toggle expand and collapse', () => {
        const body = $('[data-section-body="character"]');
        $('[data-section="character"]').click();
        assert(!body.hidden, 'character body visible after expand click');
        $('[data-section="character"]').click();
        assert(body.hidden, 'character body hidden again after collapse click');
      });

      await step('collapse state is in-memory only, never persisted', () => {
        assert(localStorage.getItem('gravity:sheet-collapsed') === null, 'sheet collapse state must not touch localStorage');
        assert(localStorage.getItem('gravity:inventory-collapsed') === null, 'inventory collapse state must not touch localStorage');
      });

      await step('top bar shows stats and the world clock', () => {
        const bar = text($('.scene__topbar'));
        // Each stat's label is screen-reader-only text in front of its value —
        // an icon stands in for it on screen.
        for (const part of ['HP: 10/10', 'AC: 10', 'AP: 3/3', 'Gold: 0', 'Luck Points: 3/3', 'Day 1:']) {
          assert(bar.includes(part), `top bar "${bar}" missing "${part}"`);
        }
        const stats = $$('.scene__topbar-stat');
        assert(stats.length === 5, `expected 5 top-bar stats, got ${stats.length}`);
        assert(stats.every(s => s.querySelector('svg.icon') && s.title), 'every stat has an icon and a hover title');
      });

      await step('scene renders narrative, options, and a skill check', () => {
        assert($('#scene-narrative .scene'), 'a scene block rendered');
        assert($$('#scene-options .card').length >= 1, 'at least one option card');
        const badge = text($('#scene-options-skills .card .card__stats'));
        // "Uses:", the same word a weapon card uses for the attribute its
        // attack rolls with — never "Bonus:", which on a card means a bonus
        // the item grants.
        assert(badge.includes('Uses:'), `skill badge "${badge}" shows the modifier`);
        assert(!badge.includes('Bonus:'), `skill badge "${badge}" does not borrow the item card's word`);
        assert(badge.includes('Difficulty Check'), `skill badge "${badge}" shows the DC`);
      });

      await step('tab notifier: dots a gain on an inactive tab only, clears on open and stays clear', () => {
        const invBtn = $('[data-tab="inventory-tab"]');   // inactive (sheet tab is active)
        window.gameEngine.state.addToInventory('healing_potion', 1);
        assert(invBtn.classList.contains('tabs__btn--notify'), 'inventory dotted on item gain');
        invBtn.click();
        assert(!invBtn.classList.contains('tabs__btn--notify'), 'tab dot cleared on opening the tab');
        window.gameEngine.state.addToInventory('healing_potion', 1);   // gain while viewing inventory
        assert(!invBtn.classList.contains('tabs__btn--notify'), 'the active tab never dots — the gain is already on screen');
        assert($$('#inventory-tab .card--new').length >= 1, 'the in-view gain is marked on its card instead');
        $('[data-tab="attributes-tab"]').click();          // leave the tab we were viewing
        assert(!invBtn.classList.contains('tabs__btn--notify'), 'leaving a viewed tab keeps it undotted');
        window.gameEngine.state.addToInventory('healing_potion', 1, { silent: true });
        assert(!invBtn.classList.contains('tabs__btn--notify'), 'a silent internal move never dots');
      });

      await step('tab notifier: card dot always; heading dot only while its section is collapsed', () => {
        // Sheet tab is active (from the previous step) so inventory is inactive.
        // Special is collapsed already — every section starts that way.
        const heading = () => $$('#inventory-tab .section-toggle').find(h => h.textContent.includes('Special'));
        $('[data-tab="inventory-tab"]').click();
        $('[data-tab="attributes-tab"]').click();                 // leave — acknowledges earlier gains
        window.gameEngine.state.addToInventory('home_rune', 1);   // the first item of a distinct new type
        $('[data-tab="inventory-tab"]').click();                  // open — the gain hides in the collapsed section
        assert(heading().classList.contains('section-toggle--notify'), 'collapsed section heading is dotted');
        heading().click();                                        // expand — the contents are revealed
        assert(!heading().classList.contains('section-toggle--notify'), 'expanding clears the heading dot');
        assert($$('#inventory-tab .card--new').length >= 1, 'the new item card is dotted');
        $('[data-tab="attributes-tab"]').click();                 // leave -> acknowledge
        $('[data-tab="inventory-tab"]').click();                  // reopen
        assert($$('#inventory-tab .card--new').length === 0, 'per-entry dot cleared after leaving the tab');
        assert($$('#inventory-tab .section-toggle--notify').length === 0, 'no heading dot on the reopened tab');
      });

      await step('tab notifier: a deliberate hover spends an item dot for good', async () => {
        // Inventory is on screen (the previous step reopened it), so a gain
        // dots the card itself. The cellar key is actionless — the branch with
        // no dataset of its own to carry the item id.
        window.gameEngine.state.addToInventory('cellar_key', 1);
        const card = () => $$('#inventory-tab .card').find(c => text(c).includes('Cellar Key'));
        const enter = () => card().dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
        const leave = () => card().dispatchEvent(new MouseEvent('mouseout', { bubbles: true }));
        assert(card().classList.contains('card--new'), 'the gained key is dotted');

        // A pointer passing over on its way somewhere else is not a look.
        enter();
        leave();
        await new Promise(r => setTimeout(r, 400));
        assert(card().classList.contains('card--new'), 'a drive-by leaves the dot alone');

        enter();
        assert(card().classList.contains('card--new'), 'the dot survives the first instant of a hover');
        await until(() => !card().classList.contains('card--new'), 'the dwell to spend the dot');

        // A re-render must not paint it back — the hover left the new-set too.
        window.gameEngine.state.addToInventory('healing_potion', 1);
        assert(!card().classList.contains('card--new'), 'the dot stays gone across a re-render');
        assert($$('#inventory-tab .card--new').length === 1, 'the unhovered gain keeps its own dot');

        // A re-render mid-dwell must not spend a dot either: the render
        // detaches the hovered card without a mouseout, so its timer fires on
        // the old node while the on-screen replacement was never dwelt on.
        const potion = () => $$('#inventory-tab .card').find(c => text(c).includes('Healing Potion'));
        potion().dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
        window.gameEngine.state.notifyListeners('inventory');   // re-render detaches the hovered card
        await new Promise(r => setTimeout(r, 400));
        window.gameEngine.state.notifyListeners('inventory');   // would drop a spent dot
        assert(potion().classList.contains('card--new'), 'a re-render mid-dwell leaves the dot alone');
      });

      await step('leaving a tab shuts every section, in that tab and the others', () => {
        const collapsed = (h) => h.classList.contains('section-toggle--collapsed');
        const invHeadings = () => $$('#inventory-tab .section-toggle');
        const sheetHeadings = () => $$('#attributes-tab .section-toggle');

        $('[data-tab="inventory-tab"]').click();
        invHeadings().filter(collapsed).forEach(h => h.click());
        assert(invHeadings().length > 0 && !invHeadings().some(collapsed), 'every inventory section is open');

        // The sheet's sections are the other group, and they're opened in a
        // panel that isn't re-rendered on the way back in — so the switch has
        // to shut them in place, not just forget they were open.
        $('[data-tab="attributes-tab"]').click();
        sheetHeadings().filter(collapsed).forEach(h => h.click());
        assert(sheetHeadings().length > 0 && !sheetHeadings().some(collapsed), 'every sheet section is open');

        $('[data-tab="quests-tab"]').click();
        assert(invHeadings().every(collapsed), 'the inventory shut behind us');
        assert(sheetHeadings().every(collapsed), 'and so did the sheet');
        assert(!$$('#attributes-tab [data-section-body]').some(b => !b.hidden),
          'the sheet bodies are hidden too, not just their headings restyled');

        // Re-entering shows the headings-only shape a first visit shows.
        $('[data-tab="inventory-tab"]').click();
        assert(invHeadings().length > 0 && invHeadings().every(collapsed), 'and it opens closed');
      });

      await step('an item card states every fact as a label/value stat row', () => {
        $('[data-tab="inventory-tab"]').click();
        window.gameEngine.state.addToInventory('eagle_eye_amulet', 1);
        window.gameEngine.state.addToInventory('leather_armor', 1);
        // Open every section — switching into the tab shut them all.
        $$('#inventory-tab .section-toggle')
          .forEach(h => { if (h.classList.contains('section-toggle--collapsed')) h.click(); });
        const card = (name) => $$('#inventory-tab .card').find(c => text(c).includes(name));
        // A row is a label span and a value span, so the grid can align them.
        const rows = (name) => [...card(name).querySelectorAll('.card__stats > *')].map(li => [
          text(li.querySelector('.card__stat-label')), text(li.querySelector('.card__stat-value')),
        ]);

        // Worn bonuses read the same however they were authored — the amulet's
        // attributeBonuses and the armor's legacy armorClassBonus both say
        // "Bonus:", and neither uses the attribute name as its label.
        assert(rows('Eagle-Eye Amulet').some(([l, v]) => l === 'Slot:' && v === 'Amulet'),
          `the slot is a stat row, not a body line (got ${JSON.stringify(rows('Eagle-Eye Amulet'))})`);
        assert(!text(card('Eagle-Eye Amulet').querySelector('.card__body')).includes('Slot'),
          'and no longer a body line');
        assert(rows('Eagle-Eye Amulet').some(([l, v]) => l === 'Bonus:' && v === '+1 Perception'),
          `the worn bonus reads "Bonus: +1 Perception" (got ${JSON.stringify(rows('Eagle-Eye Amulet'))})`);
        assert(rows('Leather Armor').some(([l, v]) => l === 'Bonus:' && v === '+2 Armor Class'),
          `armorClassBonus reads the same way (got ${JSON.stringify(rows('Leather Armor'))})`);

        // The weapon row is a different fact — the wielder's accuracy, not a
        // worn bonus — so it no longer borrows the word "Bonus".
        assert(rows('Rusty Sword').some(([l, v]) => l === 'Uses:' && v === 'Strength +0'),
          `a weapon states what it rolls with (got ${JSON.stringify(rows('Rusty Sword'))})`);
        assert(!rows('Rusty Sword').some(([l]) => l === 'Slot:'),
          'and never claims a slot — the engine picks the hand');

        // Worn, the amulet states its slot once: the "Equipped:" line owns it.
        window.gameEngine.equipItem('eagle_eye_amulet');
        const worn = $$('#inventory-tab .panel-section')
          .find(s => text(s.querySelector('.section-toggle')).includes('Equipped'))
          .querySelector('.card');
        assert(text(worn.querySelector('.card__body')) === 'Equipped: Amulet', 'the equipped card names its slot');
        assert(![...worn.querySelectorAll('.card__stat-label')].some(l => text(l) === 'Slot:'),
          'and does not repeat it as a stat row');
      });

      await step('tab notifier: a quest dot is spent the same way', async () => {
        $('[data-tab="quests-tab"]').click();
        // Re-asserting the mission's current status changes nothing in the log
        // but still counts as an update — enough to dot the card in place.
        window.gameEngine.state.setMissionStatus('escape_dungeon', 'active');
        const card = () => $$('#quests-tab .card').find(c => text(c).includes('Escape the Dungeon'));
        assert(card().classList.contains('card--new'), 'the advanced quest is dotted');

        card().dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
        card().dispatchEvent(new MouseEvent('mouseout', { bubbles: true }));
        await new Promise(r => setTimeout(r, 400));
        assert(card().classList.contains('card--new'), 'a drive-by leaves the quest dot alone');

        card().dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
        await until(() => !card().classList.contains('card--new'), 'the dwell to spend the quest dot');
        // A plain re-render must not paint it back — the hover left the
        // new-set too. (Another status update legitimately re-dots it, so this
        // renders from the current set instead of mutating the mission again.)
        window.gameEngine.state.notifyListeners('quests');
        assert(!card().classList.contains('card--new'), 'the quest dot stays gone across a re-render');
      });

      await step('inventory renders list cards with valid markup', () => {
        $('[data-tab="inventory-tab"]').click();
        assert(!$('#inventory-tab').hidden, 'inventory panel visible');
        assert($$('#inventory-tab .card').length >= 3, 'inventory cards rendered');
        // An item you can act on IS its card: a button card in its own list
        // row, carrying the action but never a slot.
        const actionable = $$('#inventory-tab ul.card-list > li > button.card[data-action]');
        assert(actionable.length >= 3, 'actionable items are whole-card buttons');
        assert(!actionable.some(c => c.dataset.slot && c.dataset.action === 'equip'), 'equip cards name no slot');
        assert(!$('#inventory-tab .card button'), 'no buttons nested in a card — the card is the control');
        assert(!$('button ul'), 'no <ul> inside any <button> (content-model invariant)');
      });

      await step('clicking an item equips it — left hand first, then right', () => {
        const equipCard = (name) => $$('#inventory-tab button.card[data-action="equip"]').find(c => text(c).includes(name));
        const equipment = () => window.gameEngine.state.getPlayer().equipment;

        equipCard('Rusty Sword').click();
        assert(equipment()['Left Hand'] === 'rusty_sword', `first equip went to ${JSON.stringify(equipment())}`);

        // The click is the user's act, so the line is the player's — the act
        // in imperative, with the engine-picked hand riding in the parens.
        const lastLog = () => $$('#scene-narrative .scene__log').at(-1);
        assert(text(lastLog()).endsWith('Equip the Rusty Sword (Left Hand)'),
          `equipping logs as the act (got "${text(lastLog())}")`);
        assert(lastLog().classList.contains('scene__log--choice'), 'in the player\'s voice, not the narrator\'s');

        equipCard('Flames').click();
        assert(equipment()['Right Hand'] === 'flames', `second equip went to ${JSON.stringify(equipment())}`);

        // Clicking an equipped card takes it off again. Each click re-renders
        // the panel, so re-query rather than iterating a stale list.
        let off = $('#inventory-tab button.card[data-action="unequip"]');
        while (off) {
          off.click();
          off = $('#inventory-tab button.card[data-action="unequip"]');
        }
        assert(Object.values(equipment()).every(id => !id), 'every slot empty after unequipping by click');
        assert(text(lastLog()).includes('Unequip the') && text(lastLog()).endsWith('(Right Hand)'),
          `unequipping logs as the act to match (got "${text(lastLog())}")`);
      });

      await step('options tab holds save/load/restart', () => {
        $('[data-tab="options-tab"]').click();
        for (const id of ['btn-save', 'btn-load', 'btn-restart']) {
          assert($(`#options-tab #${id}`), `#${id} present in options tab`);
        }
      });

      await step('options tab holds the audio controls, wired to the AudioSystem', () => {
        assert($('#options-tab #audio-mute'), 'mute checkbox present');
        for (const id of ['audio-ambience-volume', 'audio-narration-volume']) {
          assert($(`#options-tab #${id}`), `#${id} slider present`);
        }
        const mute = $('#audio-mute');
        mute.checked = true;
        mute.dispatchEvent(new Event('change', { bubbles: true }));
        assert(window.gameEngine.audio.settings.muted === true, 'mute writes through to audio settings');
        mute.checked = false;
        mute.dispatchEvent(new Event('change', { bubbles: true }));
        assert(window.gameEngine.audio.settings.muted === false, 'unmute writes through too');
      });

      await step('dungeon ambience resolved as the scene audio target', () => {
        assert(window.gameEngine.audio._ambiencePath === 'audio/ambience/dungeon.m4a',
          `ambience target is the dungeon loop (got ${window.gameEngine.audio._ambiencePath})`);
      });

      await step('an action pipeline plays its own narration clip', async () => {
        const played = [];
        const audio = window.gameEngine.audio;
        const real = audio.playNarration.bind(audio);
        audio.playNarration = (path) => played.push(path);
        const option = $$('#scene-options-actions .card').find(c => text(c).includes('closer look'));
        assert(option, 'the "take a closer look" option is on screen');
        option.click();
        await until(() => played.length > 0, 'a narration clip to be requested');
        assert(played[0] === 'audio/narration/dungeon/start__closer_look.webm',
          `the loot action's clip played (got ${played[0]})`);
        // The option re-render that follows must not stop the clip it started.
        assert(played.length === 1, `narration requested once, not ${played.length} times`);
        audio.playNarration = real;
      });

      await step('clicking a skill check advances the story', async () => {
        const logCount = $$('#scene-narrative .scene__log').length;
        $('#scene-options-skills .card').click();

          && /Short Rests:\s*Full/.test(cards('scene-options-actions').at(-2)),
          `Long Rest shows what a full rest restores (got "${cards('scene-options-actions').at(-2)}")`);
        assert(cards('scene-options').length === 1 && cards('scene-options')[0].includes('Return to Living Room'),
          `the doors list is only the way out (got ${JSON.stringify(cards('scene-options'))})`);

        // The rest is live: a click spends one pool use and its yield lands
        // on the act's own line, roll and all.
        assert(cards('scene-options-actions').some(t => /Remaining:\s*3\/3/.test(t)), 'the pool starts full');
        // Match on the title span: the Long Rest card's stat lines now
        // mention "Short Rests" too, so a whole-card text match is ambiguous.
        $$('#scene-options-actions button.card').find(b => text(b.querySelector('.card__title')) === 'Short Rest').click();
        await until(() => cards('scene-options-actions').some(t => /Remaining:\s*2\/3/.test(t)), 'a use spent');
        const restLine = $$('#scene-narrative .scene__log').map(el => text(el)).reverse().find(t => t.includes('Short Rest'));
        assert(/Short Rest \(\+\d+ HP, 1d8: \d+\)$/.test(restLine), `the yield amends the act (got "${restLine}")`);

        // The hallway's fight is an act too, sitting above the stealth and
        // charisma checks that are the other ways through the same standoff.
        engine.renderScene('dungeon_hallway');
        await until(() => cards('scene-options-actions').some(t => t.includes('Prepare to fight')), 'the hallway');
        assert(!cards('scene-options').some(t => t.includes('Prepare to fight')), 'the fight is not a door');
        assert(cards('scene-options').some(t => t.includes('Return to the Corridor')), 'which is what that list holds');
        assert(heading('scene-options-skills') === 'Skills', 'and the checks keep their own section');
        assert(gone('scene-options-conversations'), 'nobody to talk to here, and no gap where they would be');
      });

      await step('threshold moves are listed apart: entrances outdoors, exits inside', async () => {
        // A road to somewhere else and a door into a building are different kinds
        // of move, so out in the open they are listed apart. Inside a building
        // every door leads to another room of the same place, so the split would
        // say nothing and isn't made. Decided by what the pipeline navigates to —
        // never by the wording of the label.
        const engine = window.gameEngine;
        const sectionOf = (id) => {
          const el = $(`#${id}`);
          return el.hidden ? null : $$(`#${id} button.card`).map(b => text(b));
        };

        engine.renderScene('village_forge_lane');
        await until(() => text($('#scene-location-reminder')).includes('Forge Lane'), 'the forge lane');
        const exits = sectionOf('scene-options');
        const doors = sectionOf('scene-options-entrances');
        assert(text($('#scene-options-entrances .section-heading')) === 'Entrances', 'the doors earn a heading');
        assert(doors.some(t => t.includes('Go into the smithy')) && doors.length === 4,
          `every door on the lane is under it (got ${doors.join(' | ')})`);
        assert(exits.some(t => t.includes('East Row')), 'the road on stays in the unheaded list');
        assert(!exits.some(t => t.includes('Go into the smithy')), 'and no door is left among the roads');

        // A door the author also marked as the way back is still a door.
        engine.renderScene('village_hill_path');
        await until(() => text($('#scene-location-reminder')).includes('Hill Path'), 'the hill path');
        assert(sectionOf('scene-options-entrances').some(t => t.includes('Go into your house')),
          'the way home is a door, not a road');

        // Inside, the mirror: the ways out are the ones set apart, and they sit at
        // the foot of the panel where the way out has always sat.
        engine.state.addToInventory('home_rune', 1);   // so the teleport out shows
        engine.renderScene('home_living_room');
        await until(() => text($('#scene-location-reminder')).includes('Living Room'), 'the living room');
        assert(!sectionOf('scene-options-entrances'), 'inside a building there are no entrances');
        assert(text($('#scene-options-exits .section-heading')) === 'Exits', 'the ways out earn a heading');
        const ways = sectionOf('scene-options-exits');
        assert(ways.some(t => t.includes('Step outside to the hill path')), `the door out is one (got ${ways.join(' | ')})`);
        assert(ways.some(t => t.includes('Return via Teleport')), 'and so is a teleport, which leaves whatever else it does');
        assert(sectionOf('scene-options').some(t => t.includes('Enter Kitchen')),
          'while its own rooms stay in the unheaded list');
        assert(!sectionOf('scene-options').some(t => t.includes('Step outside')), 'with no way out left among them');

        // A door between two rooms of the same building is neither.
        engine.renderScene('dungeon_hallway');
        await until(() => text($('#scene-location-reminder')).includes('Stone Hallway'), 'the hallway');
        assert(!sectionOf('scene-options-exits'), 'a room-to-room door is no exit');
        assert(sectionOf('scene-options').some(t => t.includes('Return to the Corridor')),
          'it stays where it was');
      });

      await step('a road shows which way it runs; a threshold has no direction', async () => {
        // The prose stopped saying "east" — the arrow carries it now, so it has
        // to be there, has to face the right way, and has to name itself for a
        // screen reader, or dropping the word took the direction away.
        const engine = window.gameEngine;
        engine.renderScene('village_square');
        await until(() => text($('#scene-location-reminder')).includes('Village Square'), 'the square');

        const marks = (id) => $$(`#${id} button.card`).map(b => {
          const m = b.querySelector('.option-direction');
          return `${text(b.querySelector('.card__title'))}|${m ? m.dataset.point : '-'}`;
        });

        // Authored in compass order, and each arrow agrees with its place in it.
        assert(marks('scene-options').join(' ') ===
          'Walk back up the north road|N Take the forge lane|E Take Sowers Lane|S Take the mill road|W',
          `roads read round the compass (got ${marks('scene-options').join(' ')})`);

        // One glyph turned to face the road, so a direction never needs its own art.
        const east = $$('#scene-options button.card').find(b => text(b).includes('forge lane'));
        assert(east.querySelector('.option-direction').style.getPropertyValue('--turn') === '2',
          'east is two 45-degree turns from north');
        assert(text(east.querySelector('.option-direction .visually-hidden')) === 'East',
          'and says so where the arrow cannot be seen');
        assert(east.querySelector('.icon[aria-hidden="true"]'), 'the glyph itself is hidden from readers');

        // A door is a threshold, not a direction — "go in", never "go east".
        assert(marks('scene-options-entrances').every(m => m.endsWith('|-')),
          `no entrance claims a direction (got ${marks('scene-options-entrances').join(' ')})`);

        // Neither is a move between two rooms of one house.
        engine.renderScene('home_living_room');
        await until(() => text($('#scene-location-reminder')).includes('Living Room'), 'the living room');
        assert(marks('scene-options').every(m => m.endsWith('|-')),
          `indoors nothing is a road (got ${marks('scene-options').join(' ')})`);
      });

      await step('the minimap: one open world outdoors, one building inside', async () => {
        // Outdoors is continuous — every outdoor room walked, whatever region it
        // belongs to — with each building drawn as the one square it occupies,
        // so the house on the hill is on the map from the path below it. Step
        // inside anything and the map becomes that building alone: what a player
        // wants from the map in Frey's Store is the store.
        //
        // Ahead of the combat steps on purpose: they leave a fight open, and a
        // scene can't be walked into from inside one.
        const engine = window.gameEngine;
        $$('.tabs__nav button').find(b => text(b) === 'Map').click();

        const labels = () => $$('#minimap-canvas .map-node__label').map(el => text(el));
        const draw = (sceneId) => {
          engine.renderScene(sceneId);
          engine.ui.map.invalidateMinimap();
          engine.ui.map.renderMinimap();
          return labels();
        };

        // Walk down from the house into the village, the way a player would,
        // and the house gets a second room so its own map has something in it.
        for (const id of ['home_living_room', 'home_kitchen', 'village_hill_path',
          'village_crossroads', 'village_north_road', 'village_square']) {
          engine.renderScene(id);
        }

        const outdoors = draw('village_forge_lane');
        assert(!$('#minimap').hidden, 'the minimap shows');
        assert(outdoors.includes('Forge Lane'), `the road stood on draws (got ${outdoors.join(', ')})`);
        assert(outdoors.includes('Your House'), `the house draws (got ${outdoors.join(', ')})`);
        assert(!outdoors.includes('Living Room'), 'as one square, not as its rooms');
        assert(outdoors.indexOf('Your House') < outdoors.indexOf('Forge Lane'),
          'buildings paint under the world, never over it');

        // Spotted, not entered: standing on a lane puts its buildings on the map,
        // so nothing is ever walked into off a map it wasn't on. Sight stops one
        // step out — the lane beyond is visible, what stands along it is not.
        const visited = new Set(engine.state.getVisitedScenes());
        assert(!visited.has('village_marrow_cottage'), 'the cottage has never been entered');
        assert(outdoors.includes('Marrow Cottage'), `yet it is on the map (got ${outdoors.join(', ')})`);
        assert(outdoors.includes('East Row'), 'the lane beyond is in sight');
        assert(!outdoors.includes('Thatcher Cottage'), 'but not the cottages along it');

        // Outdoors the map is a viewport: the player sits at its center, and
        // discovering more world scrolls it instead of zooming it out.
        const centerOffset = () => {
          const cur = $('#minimap-canvas .map-node--current');
          const size = $('#minimap').offsetWidth;
          return Math.abs((parseFloat(cur.style.left) + parseFloat(cur.style.width) / 2) - size / 2);
        };
        const laneWidth = () => parseFloat($('#minimap-canvas .map-node--current').style.width);
        assert(centerOffset() < 1, `the player is centered (off by ${centerOffset()}px)`);

        const before = laneWidth();
        for (const id of ['village_east_row', 'village_mill_road', 'village_brookside', 'village_south_fields']) {
          engine.renderScene(id);
        }
        draw('village_forge_lane');
        assert(laneWidth() === before, `a bigger world draws at the same scale (${before} → ${laneWidth()})`);

        // A building groups by its interior region, so a second room joins the
        // same map instead of becoming a building of its own — and indoors still
        // reveals room by room, so the shop alone shows until the back is walked.
        const shop = draw('village_store');
        assert(shop.join() === 'The Shop Floor', `inside the shop, the shop (got ${shop.join(', ')})`);
        const stock = draw('village_store_back');
        assert(stock.includes('The Shop Floor') && stock.includes('The Stockroom'),
          `both rooms are the same building's map (got ${stock.join(', ')})`);
        assert(!stock.includes('Village Square'), 'with the village still outside it');

        const house = draw('home_living_room');
        assert(house.includes('Living Room') && house.includes('Kitchen'),
          `inside the house, its own rooms (got ${house.join(', ')})`);
        assert(!house.includes('Village Square') && !house.includes('Hill Path'),
          'and nothing outside it');

        // The full map must know the same places, or the two views disagree about
        // what exists. It differs only in detail: rooms for a building walked, a
        // footprint for one merely seen.
        engine.renderScene('village_forge_lane');
        engine.ui.map.openFullMap();
        const nodes = $$('#fullmap-canvas .map-node').map(n => ({
          label: text(n.querySelector('.map-node__label')),
          outline: n.classList.contains('map-node--building')
        }));
        engine.ui.map.closeFullMap();
        const named = (name) => nodes.filter(n => n.label === name);
        const drawn = nodes.map(n => n.label);

        assert(named('Marrow Cottage').length === 1 && !named('Marrow Cottage')[0].outline,
          `a building only seen is drawn, as its footprint (got ${drawn.join(', ')})`);
        assert(drawn.includes('Living Room') && drawn.includes('Kitchen'),
          'the house it has walked shows its rooms instead');
        // Rooms tile their building exactly, so an outline named above them is
        // the only thing saying which building they are.
        assert(named('Your House').length === 1 && named('Your House')[0].outline,
          'gathered by an outline named for the building, not a filled box');
        // The building is named once: by its outline. Its shop floor is tagged
        // for the room (`name`) while still titled for the shop on arrival, so
        // the same words never appear twice on the map.
        assert(named("Frey's Store").length === 1 && named("Frey's Store")[0].outline,
          `the shop is named by its outline alone (got ${drawn.join(', ')})`);
        assert(named('The Shop Floor').length === 1 && !named('The Shop Floor')[0].outline,
          'and the room inside it carries its own map tag');
        // Sowers Lane is in sight from the square but has not been walked, so the
        // yard whose gate stands on it is still two steps away.
        assert(drawn.includes('Sowers Lane'), 'a lane in sight is on the map');
        assert(!drawn.includes("Stave's Yard"), 'but not what stands along it');
      });

      await step('pointing at an option lights up where it goes', async () => {
        // The map draws places as unlabeled boxes, and the panel is holding all
        // the names — so "Go into the smithy" is only useful if you can tell
        // which box the smithy is. Pointing at the option answers it, which is
        // why the map needs no legend of its own.
        const engine = window.gameEngine;
        const lit = () => $$('#minimap-canvas .map-node--target');
        const point = (btn) => btn.dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));

        engine.renderScene('village_forge_lane');
        engine.ui.map.invalidateMinimap();
        engine.ui.map.renderMinimap();
        await until(() => text($('#scene-location-reminder')).includes('Forge Lane'), 'the forge lane');

        const door = $$('#scene-options-entrances button.card').find(b => text(b).includes('smithy'));
        assert(door.dataset.destination === 'village_smithy', 'the button declares where it goes');
        assert(!lit().length, 'nothing is lit until the player asks');

        point(door);
        // The smithy is one room, so outdoors it draws as its own building
        // square — the room is not on this map, the building is.
        assert(lit().length === 1, `exactly one place lights up (got ${lit().length})`);
        assert(lit()[0].dataset.place === 'scene:village_smithy',
          `and it is the smithy (got ${lit()[0].dataset.place})`);
        assert(lit()[0].title === 'The Smithy', `boxes name themselves on hover (got "${lit()[0].title}")`);

        // A road works the same way — this is not a buildings-only affordance.
        point($$('#scene-options button.card').find(b => text(b).includes('East Row')));
        assert(lit()[0]?.dataset.place === 'village_east_row',
          `a lane lights its own box (got ${lit()[0]?.dataset.place})`);

        // Sliding off a button onto the panel drops it again.
        $('#scene-options-panel').dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
        assert(!lit().length, 'and it lets go when the player stops pointing');

        // Inside a building the minimap draws that building's own rooms, so the
        // room itself is what lights — not the building holding it.
        engine.renderScene('home_living_room');
        engine.ui.map.invalidateMinimap();
        engine.ui.map.renderMinimap();
        await until(() => text($('#scene-location-reminder')).includes('Living Room'), 'the living room');
        point($$('#scene-options button.card').find(b => text(b).includes('Enter Kitchen')));
        assert(lit()[0]?.dataset.place === 'home_kitchen',
          `indoors it is the room that lights (got ${lit()[0]?.dataset.place})`);

        // A way out leads somewhere this map isn't drawing, so nothing lights —
        // silence, rather than a wrong box.
        point($$('#scene-options-exits button.card').find(b => text(b).includes('Step outside')));
        assert(!lit().length, 'a place off this map lights nothing');
        $('#scene-options-panel').dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
      });

      await step('a chosen solo fight introduces its enemy', async () => {
        // Nothing framed this encounter, so the NPC description is the only
        // thing establishing what the player is up against — it must survive.
        // Called directly: every combat *option* in the demo is multi-enemy,
        // which never shows a description anyway.
        window.gameEngine.combatSystem.startCombat(['lost_wanderer'], {});
        await until(() => $('.scene--combat'), 'the combat block to open');
        const body = $('.scene--combat .scene__description .scene__body');
        assert(body, 'a chosen fight keeps the enemy description');
        assert(text(body).includes('hollow-eyed'), `enemy described (got "${text(body)}")`);
        window.gameEngine.combatSystem.endCombat(true);   // leave combat cleanly
      });

      await step('an ambush is framed once: the scene describes it, the fight does not', async () => {
        // dungeon_corridor autoAttacks. Its description already narrates the
        // figure lunging, so the combat block must not repeat the NPC's own
        // description under it — one beat, one description, one clip.
        // The previous step left a combat block in the log, so wait for a new
        // one and assert against the newest — $() would return the first.
        const before = $$('.scene--combat').length;
        window.gameEngine.state.modifyPlayerStat('hp', 'full');   // don't die mid-assertion
        window.gameEngine.renderScene('dungeon_corridor');
        await until(() => $$('.scene--combat').length > before, 'a new combat block to open');
        const combat = $$('.scene--combat').pop();
        const block = combat.querySelector('.scene__description');
        assert(text(block).includes('Combat: Lost Wanderer'), `combat block titled (got "${text(block)}")`);
        assert(!block.querySelector('.scene__body'),
          `no enemy description in an ambush block (got "${text(block)}")`);
        // The block right before the fight — by sibling, not by index, since
        // the wanderer may append turns (or a Game Over) after it.
        assert(text(combat.previousElementSibling).includes('disheveled figure'),
          'the scene description before it did the framing');
      });

      await step('a log saved back when rooms tabled their exhibits still renders styled', async () => {
        // A save stores its narrative log as rendered HTML, so old entries carry
        // tables no room writes any more. Restore one and check the CSS still
        // reaches it — scrollback must not turn into bare markup.
        const legacy = {
          type: 'scene', title: 'Museum Armor Room',
          desc: 'An old hall.<div class="exhibits-table-container"><table class="exhibits-table">'
            + '<thead><tr><th>Display Stand</th><th>Showcased Relic</th></tr></thead>'
            + '<tbody><tr><td>Wall Shield Mount</td><td class="exhibits-table__item--empty">(Empty)</td></tr></tbody>'
            + '</table></div>',
        };
        const save = JSON.parse(JSON.stringify(window.gameEngine.state.state));
        save.log = [legacy];
        // The load path the file picker uses — it rebuilds the narrative DOM
        // from the saved log, which is the thing under test.
        assert(window.gameEngine.ui._applyLoadedSave(save) !== false, 'the legacy save loads');
        await until(() => $('#scene-narrative .exhibits-table'), 'the restored old table');

        const table = $('#scene-narrative .exhibits-table');
        const th = getComputedStyle(table.querySelector('th'));
        const td = getComputedStyle(table.querySelector('.exhibits-table__item--empty'));
        assert(th.textTransform === 'uppercase', `old headers keep their styling (got ${th.textTransform})`);
        assert(td.fontStyle === 'italic', `old empty cells keep theirs (got ${td.fontStyle})`);
        assert(parseFloat(getComputedStyle(table.querySelector('td')).paddingTop) > 0, 'and the cells keep their padding');
      });

      await step('buying and selling are narrated, the trade buttons are the choice', async () => {
        // Money changing hands is a consequence, not a choice — same voice as
        // lifting a relic out of a case. The merchant lives deep in the dungeon,
        // so the conversation is opened directly rather than walked to. Last in
        // the run: it leaves the game in a conversation, not in a scene.
        const engine = window.gameEngine;
        const cards = () => $$('#scene-options-panel button.card');
        const lastLog = () => $$('#scene-narrative .scene__log').at(-1);
        const lastLogText = () => { const el = lastLog().cloneNode(true); el.querySelector('.scene__log-prefix')?.remove(); return text(el); };

        engine.state.modifyPlayerStat('gold', 500);
        engine.dialogueSystem.startDialogue('mysterious_stranger');
        await until(() => cards().some(c => text(c).includes('Let\'s trade')), 'the stranger');
        cards().find(c => text(c).includes('Let\'s trade')).click();

        await until(() => cards().some(c => /^Buy /.test(text(c))), 'the trade screen');
        assert(lastLogText() === 'Let\'s trade.', `opening the trade is the choice (got "${lastLogText()}")`);
        assert(lastLog().classList.contains('scene__log--choice'), 'logged in the player\'s voice');

        cards().find(c => /^Buy /.test(text(c))).click();
        await until(() => /^You bought the /.test(lastLogText()), 'the purchase line');
        assert(lastLog().classList.contains('scene__log--loot'), 'still gold-coloured');
        assert(!lastLog().classList.contains('scene__log--choice'), 'but not in the player\'s voice');

        cards().find(c => /^Sell /.test(text(c))).click();
        await until(() => /^You sold the /.test(lastLogText()), 'the sale line');

        // Backing out of the trade is a choice too, and its label carries no
        // trailing period — the log line is the button, verbatim.
        cards().find(c => text(c) === 'Never mind').click();
        await until(() => cards().some(c => text(c).includes('I must be going')), 'the conversation again');
        assert(lastLogText() === 'Never mind', `backing out is a choice (got "${lastLogText()}")`);
      });

      await step('a staged quest: card shows the objective, loot advances it, hand-in completes it', async () => {
        // Bron's shard hunt, driven through the engine's trigger surface. Late
        // in the run so the shard loot can't skew earlier exact-value asserts.
        const engine = window.gameEngine;
        const card = () => $$('#quests-tab .card').find(c => text(c).includes('Echoes of the Sunstone'));

        engine.handleQuestTrigger({ mission: 'sunstone_shards', status: 'active' });
        assert(card(), 'the staged quest card renders');
        assert(text(card()).includes('Recover two sunstone shards'), 'the active card shows its current objective');

        engine.state.addToInventory('sunstone_shard', 1);
        assert(engine.state.getMissionStage('sunstone_shards') === 'collect_shards', 'one shard is not enough');
        engine.state.addToInventory('sunstone_shard', 1);
        assert(engine.state.getMissionStage('sunstone_shards') === 'show_bron', 'the second shard advanced the stage');
        assert(text(card()).includes('Show the shards to Bron'), 'the card follows the stage');

        engine.handleQuestTrigger({ mission: 'sunstone_shards', status: 'complete' });
        const sections = $$('#quests-tab .panel-section');
        const completed = sections.find(s => text(s).includes('Completed Quests'));
        assert(completed && text(completed).includes('Echoes of the Sunstone'), 'the quest lands under Completed Quests');
      });

      await step('no uncaught errors during the run', () => {
        assert(errors.length === 0, `caught: ${errors.join(' | ')}`);
      });

      report(true);
    });
  </script>
</body>

</html>
