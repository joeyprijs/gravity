<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- Everything (engine fetches, plugin imports, stylesheet) resolves
       against the repo root, exactly as it does for index.html. -->
  <base href="../">
  <title>Gravity smoke test</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* The results panel floats above the live game so a failing step can be
       inspected in place. */
    #smoke-results {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 9999;
      max-width: 420px;
      max-height: 60vh;
      overflow-y: auto;
      padding: 12px 16px;
      background: rgba(10, 10, 12, 0.95);
      border: 1px solid #444;
      font: 12px/1.5 monospace;
      color: #ddd;
      white-space: pre-wrap;
    }

    #smoke-results .pass { color: #7dd87d; }
    #smoke-results .fail { color: #ff7d7d; font-weight: bold; }
  </style>
</head>

<body>
  <div id="smoke-results">smoke: booting…</div>

  <script type="module">
    // Gravity UI smoke test — zero dependencies, runs in a real browser.
    //
    //   python3 -m http.server 3000   →   open /tests/smoke.html
    //
    // It boots the real engine against the shipped demo data, drives the UI
    // like a player, and asserts the surfaces the Node tests can't reach
    // (they have no DOM). Results render in the corner panel;
    // `window.__SMOKE__` and the document title carry the verdict for
    // automation.
    import { RPGEngine } from './src/core/engine.js';

    // Set synchronously, before any await: the engine's DOMContentLoaded
    // listener may fire mid-module (the event doesn't wait for top-level
    // await), and it must not boot an engine against the not-yet-injected
    // skeleton.
    window.GRAVITY_MANUAL_BOOT = true;

    // ── Harness ────────────────────────────────────────────────────────────
    const results = [];
    const errors = [];
    window.addEventListener('error', (e) => errors.push(e.message));
    window.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));

    const assert = (cond, message) => {
      if (!cond) throw new Error(message);
    };
    const until = (cond, what, timeout = 5000) => new Promise((resolve, reject) => {
      const t0 = performance.now();
      (function poll() {
        let value;
        try { value = cond(); } catch { /* not ready yet */ }
        if (value) return resolve(value);
        if (performance.now() - t0 > timeout) return reject(new Error(`timed out waiting for ${what}`));
        setTimeout(poll, 50);
      })();
    });
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => [...document.querySelectorAll(sel)];
    const text = (el) => (el?.textContent ?? '').replace(/\s+/g, ' ').trim();

    async function step(name, fn) {
      try {
        await fn();
        results.push({ name, ok: true });
      } catch (err) {
        results.push({ name, ok: false, error: err.message });
      }
      report(false);
    }

    function report(done) {
      const failed = results.filter(r => !r.ok);
      const panel = document.getElementById('smoke-results');
      panel.innerHTML = results.map(r =>
        `<div class="${r.ok ? 'pass' : 'fail'}">${r.ok ? '✓' : '✗'} ${r.name}${r.ok ? '' : ` — ${r.error}`}</div>`
      ).join('') + (done ? `<div class="${failed.length ? 'fail' : 'pass'}">— ${results.length - failed.length}/${results.length} passed —</div>` : '');
      if (done) {
        document.title = failed.length ? `SMOKE: FAIL (${failed.length})` : `SMOKE: PASS (${results.length})`;
        window.__SMOKE__ = { done: true, passed: results.length - failed.length, failed: failed.length, results };
        // Which steps failed, in the URL. A headless runner can read the title
        // and the URL of a target over Chrome's plain-HTTP DevTools endpoint —
        // so scripts/run-smoke.sh can name the broken step in CI output without
        // a WebSocket client to reach into the page.
        if (failed.length) location.hash = `failed=${encodeURIComponent(failed.map(r => r.name).join(' | '))}`;
      }
    }

    // ── Boot the real game ─────────────────────────────────────────────────
    // Section collapse state is in-memory only, but builds that predate that
    // persisted it under these keys — clear leftovers so the 'never persisted'
    // step below proves the current code writes nothing, not that the profile
    // happens to be clean.
    localStorage.removeItem('gravity:sheet-collapsed');
    localStorage.removeItem('gravity:inventory-collapsed');

    // The DOM skeleton comes from index.html itself — one source of truth,
    // so this page can't drift from the markup the engine actually targets.
    const indexHtml = await fetch('index.html').then(r => r.text());
    const indexDoc = new DOMParser().parseFromString(indexHtml, 'text/html');
    for (const id of ['char-creation', 'file-upload', 'game-container']) {
      const node = indexDoc.getElementById(id);
      assert(node, `index.html is missing #${id}`);
      document.body.appendChild(document.importNode(node, true));
    }

    // Construct the engine directly — the skeleton above was injected after
    // DOMContentLoaded, so the production boot listener can't fire here (it
    // guards against double-boot for exactly this case).
    window.gameEngine = new RPGEngine();

    // ── The suite ──────────────────────────────────────────────────────────
    queueMicrotask(async () => {
      await step('engine boots to character creation', async () => {
        await until(() => window.gameEngine, 'engine construction');
        await until(() => !$('#char-creation').hidden && $('#char-creation').children.length, 'char-creation screen');
      });

      await step('character creation confirms into the game', async () => {
        const nameInput = $('#char-creation input[type="text"]');
        assert(nameInput, 'name input exists');
        nameInput.value = 'Smoke Tester';
        const confirm = $('.char-creation__confirm-btn');
        assert(confirm, 'confirm button exists');
        confirm.click();
        await until(() => !$('#game-container').hidden, 'game container to show');
      });

      await step('tabs build from rules with the sheet active', () => {
        const tabs = $$('.tabs__nav button');
        assert(tabs.length === 5, `expected 5 tabs, got ${tabs.length}`);
        assert(text(tabs[0]) === 'Sheet', `first tab is "${text(tabs[0])}", expected "Sheet"`);
        assert(tabs[0].classList.contains('tabs__btn--active'), 'sheet tab starts active');
        assert(tabs.every(t => t.querySelector('svg.icon')), 'every tab renders its rules.tabs[].icon');
        assert(!$('#attributes-tab').hidden, 'sheet panel visible');
        assert($('#inventory-tab').hidden, 'inventory panel hidden');
      });

      await step('sheet sections start expanded', () => {
        assert(!$('[data-section-body="character"]').hidden, 'character body visible');
        assert(!$('[data-section-body="skills"]').hidden, 'skills body visible');
      });

      await step('character section: rows, plugin row, bound values', () => {
        const rows = $$('[data-section-body="character"] .attr-list__row');
        const labels = rows.map(r => text(r.querySelector('.attr-list__label')));
        const expected = ['Name', 'Level', 'Hit Points', 'Armor Class', 'Initiative', 'Action Points', 'Luck Points', 'Gold', 'Reputation'];
        assert(JSON.stringify(labels) === JSON.stringify(expected),
          `row labels ${JSON.stringify(labels)}`);
        const value = (label) => text(rows[labels.indexOf(label)].querySelector('.attr-list__value'));
        assert(value('Name') === 'Smoke Tester', `name row shows "${value('Name')}"`);
        assert(value('Hit Points') === '10/10', `HP row shows "${value('Hit Points')}"`);
        assert(value('Reputation') === '0', `reputation row shows "${value('Reputation')}"`);
        // Level-up point-buy covers the char-creation stats: HP, AC, and
        // Initiative rows carry spend buttons (hidden until points are banked).
        assert($('[data-spend-attr="resources.hp.max"]'), 'HP row has a spend button');
        assert($('[data-spend-attr="attributes.ac"]'), 'AC row has a spend button');
        assert($('[data-spend-attr="attributes.initiative"]'), 'Initiative row has a spend button');
        // Every row is marked, including the plugin's (registerSheetRow icon).
        assert(rows.every(r => r.querySelector('.attr-list__label svg.icon')), 'every character row shows an icon');
      });

      await step('skills section lists the custom attributes', () => {
        const rows = $$('[data-section-body="skills"] .attr-list__row');
        const labels = rows.map(r => text(r.querySelector('.attr-list__label')));
        assert(JSON.stringify(labels) === JSON.stringify(['Strength', 'Intelligence', 'Perception', 'Stealth', 'Charisma', 'Luck']),
          `skill labels ${JSON.stringify(labels)}`);
        assert(rows.every(r => r.querySelector('.attr-list__label svg.icon')), 'every skill row shows its rules.customAttributes[].icon');
      });

      await step('section headings toggle collapse and expand', () => {
        const body = $('[data-section-body="character"]');
        $('[data-section="character"]').click();
        assert(body.hidden, 'character body hidden after collapse click');
        $('[data-section="character"]').click();
        assert(!body.hidden, 'character body visible again after expand click');
      });

      await step('collapse state is in-memory only, never persisted', () => {
        assert(localStorage.getItem('gravity:sheet-collapsed') === null, 'sheet collapse state must not touch localStorage');
        assert(localStorage.getItem('gravity:inventory-collapsed') === null, 'inventory collapse state must not touch localStorage');
      });

      await step('top bar shows stats and the world clock', () => {
        const bar = text($('.scene__topbar'));
        // Each stat's label is screen-reader-only text in front of its value —
        // an icon stands in for it on screen.
        for (const part of ['HP: 10/10', 'AC: 10', 'AP: 3/3', 'Gold: 0', 'Luck Points: 3/3', 'Day 1:']) {
          assert(bar.includes(part), `top bar "${bar}" missing "${part}"`);
        }
        const stats = $$('.scene__topbar-stat');
        assert(stats.length === 5, `expected 5 top-bar stats, got ${stats.length}`);
        assert(stats.every(s => s.querySelector('svg.icon') && s.title), 'every stat has an icon and a hover title');
      });

      await step('scene renders narrative, options, and a skill check', () => {
        assert($('#scene-narrative .scene'), 'a scene block rendered');
        assert($$('#scene-options .card').length >= 1, 'at least one option card');
        const badge = text($('#scene-options-skills .card .card__stats'));
        assert(badge.includes('Bonus:'), `skill badge "${badge}" shows the modifier`);
        assert(badge.includes('Difficulty Check'), `skill badge "${badge}" shows the DC`);
      });

      await step('tab notifier: dots a gain on an inactive tab only, clears on open and stays clear', () => {
        const invBtn = $('[data-tab="inventory-tab"]');   // inactive (sheet tab is active)
        window.gameEngine.state.addToInventory('healing_potion', 1);
        assert(invBtn.classList.contains('tabs__btn--notify'), 'inventory dotted on item gain');
        invBtn.click();
        assert(!invBtn.classList.contains('tabs__btn--notify'), 'tab dot cleared on opening the tab');
        window.gameEngine.state.addToInventory('healing_potion', 1);   // gain while viewing inventory
        assert(!invBtn.classList.contains('tabs__btn--notify'), 'the active tab never dots — the gain is already on screen');
        assert($$('#inventory-tab .card--new').length >= 1, 'the in-view gain is marked on its card instead');
        $('[data-tab="attributes-tab"]').click();          // leave the tab we were viewing
        assert(!invBtn.classList.contains('tabs__btn--notify'), 'leaving a viewed tab keeps it undotted');
        window.gameEngine.state.addToInventory('healing_potion', 1, { silent: true });
        assert(!invBtn.classList.contains('tabs__btn--notify'), 'a silent internal move never dots');
      });

      await step('tab notifier: card dot always; heading dot only while its section is collapsed', () => {
        // Sheet tab is active (from the previous step) so inventory is inactive.
        const heading = () => $$('#inventory-tab .section-toggle').find(h => h.textContent.includes('Consumables'));
        $('[data-tab="inventory-tab"]').click();
        heading().click();                                        // collapse Consumables
        $('[data-tab="attributes-tab"]').click();                 // leave — acknowledges earlier gains
        window.gameEngine.state.addToInventory('home_rune', 1);   // a distinct new Consumable
        $('[data-tab="inventory-tab"]').click();                  // open — the gain hides in the collapsed section
        assert(heading().classList.contains('section-toggle--notify'), 'collapsed section heading is dotted');
        heading().click();                                        // expand — the contents are revealed
        assert(!heading().classList.contains('section-toggle--notify'), 'expanding clears the heading dot');
        assert($$('#inventory-tab .card--new').length >= 1, 'the new item card is dotted');
        $('[data-tab="attributes-tab"]').click();                 // leave -> acknowledge
        $('[data-tab="inventory-tab"]').click();                  // reopen
        assert($$('#inventory-tab .card--new').length === 0, 'per-entry dot cleared after leaving the tab');
        assert($$('#inventory-tab .section-toggle--notify').length === 0, 'no heading dot on the reopened tab');
      });

      await step('tab notifier: a deliberate hover spends an item dot for good', async () => {
        // Inventory is on screen (the previous step reopened it), so a gain
        // dots the card itself. The cellar key is actionless — the branch with
        // no dataset of its own to carry the item id.
        window.gameEngine.state.addToInventory('cellar_key', 1);
        const card = () => $$('#inventory-tab .card').find(c => text(c).includes('Cellar Key'));
        const enter = () => card().dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
        const leave = () => card().dispatchEvent(new MouseEvent('mouseout', { bubbles: true }));
        assert(card().classList.contains('card--new'), 'the gained key is dotted');

        // A pointer passing over on its way somewhere else is not a look.
        enter();
        leave();
        await new Promise(r => setTimeout(r, 400));
        assert(card().classList.contains('card--new'), 'a drive-by leaves the dot alone');

        enter();
        assert(card().classList.contains('card--new'), 'the dot survives the first instant of a hover');
        await until(() => !card().classList.contains('card--new'), 'the dwell to spend the dot');

        // A re-render must not paint it back — the hover left the new-set too.
        window.gameEngine.state.addToInventory('healing_potion', 1);
        assert(!card().classList.contains('card--new'), 'the dot stays gone across a re-render');
        assert($$('#inventory-tab .card--new').length === 1, 'the unhovered gain keeps its own dot');

        // A re-render mid-dwell must not spend a dot either: the render
        // detaches the hovered card without a mouseout, so its timer fires on
        // the old node while the on-screen replacement was never dwelt on.
        const potion = () => $$('#inventory-tab .card').find(c => text(c).includes('Healing Potion'));
        potion().dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
        window.gameEngine.state.notifyListeners('inventory');   // re-render detaches the hovered card
        await new Promise(r => setTimeout(r, 400));
        window.gameEngine.state.notifyListeners('inventory');   // would drop a spent dot
        assert(potion().classList.contains('card--new'), 'a re-render mid-dwell leaves the dot alone');
      });

      await step('tab notifier: a quest dot is spent the same way', async () => {
        $('[data-tab="quests-tab"]').click();
        // Re-asserting the mission's current status changes nothing in the log
        // but still counts as an update — enough to dot the card in place.
        window.gameEngine.state.setMissionStatus('escape_dungeon', 'active');
        const card = () => $$('#quests-tab .card').find(c => text(c).includes('Escape the Dungeon'));
        assert(card().classList.contains('card--new'), 'the advanced quest is dotted');

        card().dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
        card().dispatchEvent(new MouseEvent('mouseout', { bubbles: true }));
        await new Promise(r => setTimeout(r, 400));
        assert(card().classList.contains('card--new'), 'a drive-by leaves the quest dot alone');

        card().dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
        await until(() => !card().classList.contains('card--new'), 'the dwell to spend the quest dot');
        // A plain re-render must not paint it back — the hover left the
        // new-set too. (Another status update legitimately re-dots it, so this
        // renders from the current set instead of mutating the mission again.)
        window.gameEngine.state.notifyListeners('quests');
        assert(!card().classList.contains('card--new'), 'the quest dot stays gone across a re-render');
      });

      await step('inventory renders list cards with valid markup', () => {
        $('[data-tab="inventory-tab"]').click();
        assert(!$('#inventory-tab').hidden, 'inventory panel visible');
        assert($$('#inventory-tab .card').length >= 3, 'inventory cards rendered');
        // An item you can act on IS its card: a button card in its own list
        // row, carrying the action but never a slot.
        const actionable = $$('#inventory-tab ul.card-list > li > button.card[data-action]');
        assert(actionable.length >= 3, 'actionable items are whole-card buttons');
        assert(!actionable.some(c => c.dataset.slot && c.dataset.action === 'equip'), 'equip cards name no slot');
        assert(!$('#inventory-tab .card button'), 'no buttons nested in a card — the card is the control');
        assert(!$('button ul'), 'no <ul> inside any <button> (content-model invariant)');
      });

      await step('clicking an item equips it — left hand first, then right', () => {
        const equipCard = (name) => $$('#inventory-tab button.card[data-action="equip"]').find(c => text(c).includes(name));
        const equipment = () => window.gameEngine.state.getPlayer().equipment;

        equipCard('Rusty Sword').click();
        assert(equipment()['Left Hand'] === 'rusty_sword', `first equip went to ${JSON.stringify(equipment())}`);
        equipCard('Flames').click();
        assert(equipment()['Right Hand'] === 'flames', `second equip went to ${JSON.stringify(equipment())}`);

        // Clicking an equipped card takes it off again. Each click re-renders
        // the panel, so re-query rather than iterating a stale list.
        let off = $('#inventory-tab button.card[data-action="unequip"]');
        while (off) {
          off.click();
          off = $('#inventory-tab button.card[data-action="unequip"]');
        }
        assert(Object.values(equipment()).every(id => !id), 'every slot empty after unequipping by click');
      });

      await step('options tab holds save/load/restart', () => {
        $('[data-tab="options-tab"]').click();
        for (const id of ['btn-save', 'btn-load', 'btn-restart']) {
          assert($(`#options-tab #${id}`), `#${id} present in options tab`);
        }
      });

      await step('options tab holds the audio controls, wired to the AudioSystem', () => {
        assert($('#options-tab #audio-mute'), 'mute checkbox present');
        for (const id of ['audio-ambience-volume', 'audio-narration-volume']) {
          assert($(`#options-tab #${id}`), `#${id} slider present`);
        }
        const mute = $('#audio-mute');
        mute.checked = true;
        mute.dispatchEvent(new Event('change', { bubbles: true }));
        assert(window.gameEngine.audio.settings.muted === true, 'mute writes through to audio settings');
        mute.checked = false;
        mute.dispatchEvent(new Event('change', { bubbles: true }));
        assert(window.gameEngine.audio.settings.muted === false, 'unmute writes through too');
      });

      await step('dungeon ambience resolved as the scene audio target', () => {
        assert(window.gameEngine.audio._ambiencePath === 'audio/ambience/dungeon.m4a',
          `ambience target is the dungeon loop (got ${window.gameEngine.audio._ambiencePath})`);
      });

      await step('an action pipeline plays its own narration clip', async () => {
        const played = [];
        const audio = window.gameEngine.audio;
        const real = audio.playNarration.bind(audio);
        audio.playNarration = (path) => played.push(path);
        const option = $$('#scene-options .card').find(c => text(c).includes('closer look'));
        assert(option, 'the "take a closer look" option is on screen');
        option.click();
        await until(() => played.length > 0, 'a narration clip to be requested');
        assert(played[0] === 'audio/narration/dungeon/start__closer_look.webm',
          `the loot action's clip played (got ${played[0]})`);
        // The option re-render that follows must not stop the clip it started.
        assert(played.length === 1, `narration requested once, not ${played.length} times`);
        audio.playNarration = real;
      });

      await step('clicking a skill check advances the story', async () => {
        const logCount = $$('#scene-narrative .scene__log').length;
        $('#scene-options-skills .card').click();
        await until(() => $$('#scene-narrative .scene__log').length > logCount, 'narrative log to grow');
      });

      await step('inside the museum, reputation stands under the scene name', async () => {
        // Awarded through the stat handler the curator registers — the same
        // path acquiring a relic takes.
        window.gameEngine.state.modifyPlayerStat('reputation', 12);
        window.gameEngine.renderScene('home_museum');
        await until(() => text($('#scene-location-reminder')).includes('Museum Lobby'), 'the museum lobby');
        const rep = $('#scene-location-reminder .curator-scene-rep');
        assert(rep, 'the reputation line renders in the lobby, which has no display cases');
        assert(text($('.curator-scene-rep__label')) === 'Reputation', 'the line is labelled');
        assert(text($('.curator-scene-rep__value')) === '12 Points', `value reads "${text($('.curator-scene-rep__value'))}"`);

        window.gameEngine.renderScene('home_living_room');
        await until(() => text($('#scene-location-reminder')).includes('Living Room'), 'the living room');
        assert(!$('#scene-location-reminder .curator-scene-rep'), 'no reputation line outside the museum');
      });

      await step('walking into a wing opens the curator panel, titled with the room', async () => {
        // Curating is what the room is for, so no button press stands between
        // the player and the panel — and the panel names the room, not itself.
        const openPanel = () => $$('#scene-options-panel button.card').some(b => text(b).includes('Install New Display Case'));
        window.gameEngine.renderScene('home_museum_relics');
        await until(openPanel, 'the panel to open by itself');
        assert(text($('#scene-location-reminder')).includes('Relic Wing'),
          `the room names itself (got "${text($('#scene-location-reminder'))}")`);
        assert(!text($('#scene-location-reminder')).includes('Curator Panel'), 'and not the panel');
        assert($('#scene-location-reminder .curator-scene-rep'), 'the reputation line stands with the panel open');
        assert($$('.curator-scene-rep').length === 1, 'shown once, not twice');
        assert(text($('.curator-scene-rep__value')) === '12 Points', `value reads "${text($('.curator-scene-rep__value'))}"`);

        // A same-scene re-render swaps the panel back out for the room's own
        // options, and must NOT reopen it.
        window.gameEngine.renderScene('home_museum_relics');
        await until(() => $$('#scene-options .card').some(c => text(c).includes('Curator Panel')), 'the room\'s own options');
        assert(!openPanel(), 'a re-render leaves the panel closed');
        assert(text($('.curator-scene-rep__value')) === '12 Points', 'the line reads the same either way');
      });

      await step('the panel\'s way out is the room\'s: one click to the lobby', async () => {
        // There is nothing to do in a wing but curate, so the panel carries the
        // room's exit instead of a Done that would only reveal it.
        window.gameEngine.renderScene('home_museum');
        await until(() => $$('#scene-options-panel button.card').some(b => text(b).includes('Enter the Relic Wing')), 'the hall');
        $$('#scene-options-panel button.card').find(b => text(b).includes('Enter the Relic Wing')).click();
        await until(() => $$('#scene-options-panel button.card').some(b => text(b).includes('Install New Display Case')), 'the wing\'s panel');

        const exit = $$('#scene-options-panel button.card').find(b => text(b).includes('Go back to Museum Lobby'));
        assert(exit, 'the panel offers the room\'s exit');
        assert(!$$('#scene-options-panel button.card').some(b => text(b) === 'Done'), 'and no Done in front of it');
        exit.click();
        await until(() => text($('#scene-location-reminder')).includes('Museum Lobby'), 'the lobby, in one click');
        assert(window.gameEngine.state.getCurrentSceneId() === 'home_museum', 'no stop-off in the wing\'s options');
      });

      await step('the personal chest: item cards with stats, clicked to move a stack', async () => {
        const state = window.gameEngine.state;
        const panelCards = () => $$('#scene-options-panel button.card');
        const row = (name) => panelCards().find(b => text(b).includes(name));

        // The chest's contents are a block of their own in the log, written when
        // it opens — so it reads click, then result — and kept current after that
        // without the rows moving about.
        const chestTable = () => $$('#scene-narrative .scene__contents .contents-table').pop();

        window.gameEngine.renderScene('home_bedroom');
        await until(() => $$('#scene-options .card').some(c => text(c).includes('Personal Chest')), 'the bedroom');
        assert(!chestTable(), 'a shut chest keeps its contents to itself');
        // The bedroom's own description — museum blocks further up the log do
        // carry tables, and should.
        assert(!$$('#scene-narrative .scene__body').pop().querySelector('.contents-table'),
          'the room description never tables the chest');
        $$('#scene-options .card').find(c => text(c).includes('Personal Chest')).click();
        await until(() => row('Rusty Sword'), 'the chest panel with an inventory row');
        // The panel names the chest while it owns the screen.
        assert(text($('#scene-location-reminder')) === 'Personal Chest',
          `the heading names the chest (got "${text($('#scene-location-reminder'))}")`);
        // The table breaks the run of [Player] lines: whatever is logged next
        // starts a fresh group, with its label and the full gap — a continuation
        // would tuck itself right under the table.
        const firstAfterBlock = () => {
          const block = $('#scene-narrative .scene__contents');
          let el = block?.nextElementSibling;
          while (el && !el.classList.contains('scene__log')) el = el.nextElementSibling;
          return el;
        };

        // Opening it is a thing the player did, so the log says so — and the
        // contents land AFTER that line, the way a room's block follows the
        // choice that walked you in.
        const openLine = $$('#scene-narrative .scene__log').find(p => text(p).includes('Open Personal Chest'));
        assert(openLine, 'the log records the opening');
        const block = $('#scene-narrative .scene__contents');
        assert(block, 'the contents block is in the log');
        assert(openLine.compareDocumentPosition(block) & Node.DOCUMENT_POSITION_FOLLOWING,
          'the contents come after the [Player] line, not before it');

        // Every row is a plain item card: the item's stats, no action verb.
        assert(text(row('Rusty Sword')).includes('Damage:'), `stats on the row (got "${text(row('Rusty Sword'))}")`);
        assert(!panelCards().some(b => /\b(Take|Deposit)\b/.test(text(b))), 'no Take/Deposit labels anywhere in the panel');

        // Clicking an inventory row puts one in, and the chest row takes it out.
        const inBag = () => state.countPlayerItem('rusty_sword', { includeEquipped: false });
        const inChest = () => state.getChest('personal').find(s => s.item === 'rusty_sword')?.amount ?? 0;
        const bagBefore = inBag();
        const rowCount = () => $$('#scene-narrative .scene__contents tbody tr').length;
        row('Rusty Sword').click();
        await until(() => inChest() === 1, 'the sword to land in the chest');
        assert(inBag() === bagBefore - 1, 'and to leave the bag');
        await until(() => text(chestTable()).includes('Rusty Sword'), 'the table to keep up');
        const depositLine = $$('#scene-narrative .scene__log').find(p => text(p).includes('You placed Rusty Sword'));
        assert(depositLine, 'the deposit is narrated');
        assert(firstAfterBlock() === depositLine, 'it is the first line under the table');
        assert(!depositLine.classList.contains('scene__log--grouped'), 'not tucked under it as a continuation');
        assert(depositLine.querySelector('.scene__log-prefix'), 'and it keeps its [Narrator] label');
        assert($('#scene-narrative .scene__contents').compareDocumentPosition(depositLine) & Node.DOCUMENT_POSITION_FOLLOWING,
          'and lands under the table');

        // Two rows read "Rusty Sword" now (chest + bag), so take the chest's.
        const chestSection = $$('#scene-options-panel .panel-section')
          .find(s => text(s.querySelector('.section-heading')) === 'Contents');
        const rowsWithSword = rowCount();
        [...chestSection.querySelectorAll('button.card')].find(b => text(b).includes('Rusty Sword')).click();
        await until(() => inChest() === 0, 'the sword to come back out');
        assert(inBag() === bagBefore, 'and to be back in the bag');
        // The last one out takes the row with it — no 0 rows left behind.
        assert(rowCount() === rowsWithSword - 1, `the row is gone (${rowsWithSword} → ${rowCount()})`);
        assert(!text(chestTable()).includes('Rusty Sword'), 'and the sword is not listed');

        // Empty it out completely: the table gives way to an empty-chest line.
        const emptyOut = () => {
          const section = $$('#scene-options-panel .panel-section')
            .find(s => text(s.querySelector('.section-heading')) === 'Contents');
          const next = [...section.querySelectorAll('button.card')].find(b => !b.disabled);
          if (next) { next.click(); return true; }
          return false;
        };
        while (emptyOut()) await new Promise(r => setTimeout(r, 30));
        await until(() => $('#scene-narrative .scene__contents .contents-table__empty'), 'the empty-chest line');
        assert(!chestTable(), 'and no table over nothing');
        assert(text($('#scene-narrative .scene__contents')) === 'Chest is empty.',
          `the empty message reads right (got "${text($('#scene-narrative .scene__contents'))}")`);

        // Put something back, then shut the chest: closing is logged too, and
        // the block stays in the log.
        row('Healing Potion').click();
        await until(() => state.getChest('personal').some(s => s.item === 'healing_potion'), 'the potion in the chest');
        panelCards().find(b => text(b) === 'Done').click();
        await until(() => text($('#scene-location-reminder')).includes('Bedroom'), 'the bedroom again');
        const closeLine = $$('#scene-narrative .scene__log').pop();
        assert(text(closeLine).includes('Close Chest'), `closing is logged (got "${text(closeLine)}")`);
        assert(text(closeLine).startsWith('[Player]'), `in the player's voice (got "${text(closeLine)}")`);
        assert($('#scene-narrative .scene__contents'), 'the opening block stays in the log');

        // Opening it again writes a fresh block — this one showing the potion,
        // since that is what is in there now.
        $$('#scene-options .card').find(c => text(c).includes('Personal Chest')).click();
        await until(() => $$('#scene-narrative .scene__contents').length === 2, 'a second contents block');
        assert(text(chestTable()).includes('Healing Potion'), 'the new snapshot shows what is in there now');
        panelCards().find(b => text(b) === 'Done').click();
        await until(() => text($('#scene-location-reminder')).includes('Bedroom'), 'the bedroom');
      });

      await step('clicking an exhibited relic takes it back out of its case', async () => {
        // The relic wing ships a Rusty Sword in its Glass Case. The item card is
        // the control here, exactly as in the inventory — no separate button.
        const state = window.gameEngine.state;
        const panelCards = () => $$('#scene-options-panel button.card');
        window.gameEngine.renderScene('home_museum_relics');   // arrival opens the panel
        await until(() => panelCards().some(b => text(b).includes('Glass Case')), 'the exhibits list');

        const before = state.countPlayerItem('rusty_sword');
        panelCards().find(b => text(b).includes('Glass Case')).click();
        await until(() => panelCards().some(b => text(b).includes('Rusty Sword')), 'the case\'s contents');
        // Back + the relic card, and nothing else: the card is the control, and
        // it reads as a plain item card — stats, no action verb.
        assert(panelCards().length === 2, `two cards on the inspect screen, got ${panelCards().length}`);
        const relicCard = panelCards().find(b => text(b).includes('Rusty Sword'));
        assert(text(relicCard).includes('Value:'), `the relic shows its stats (got "${text(relicCard)}")`);
        assert(!/Retrieve|Take/.test(text(relicCard)), `no action verb on the card (got "${text(relicCard)}")`);

        panelCards().find(b => text(b).includes('Rusty Sword')).click();
        await until(() => panelCards().some(b => text(b).includes('Install New Display Case')), 'the dashboard again');
        assert(state.countPlayerItem('rusty_sword') === before + 1, 'the relic is in the player\'s bag');
        const glassCase = state.getDisplaysForScene('home_museum_relics').find(d => d.name === 'Glass Case');
        assert(glassCase.item === null, `the case is empty (holds ${glassCase.item})`);

        panelCards().find(b => text(b).includes('Go back to Museum Lobby')).click();
        await until(() => text($('#scene-location-reminder')).includes('Museum Lobby'), 'the lobby');
      });

      await step('hall and wing read the same: exit, what is here, construction', async () => {
        // The lobby is a museum room like any other — same panel, same order —
        // so moving through the museum never rearranges under the player.
        // The location reminder is a .section-heading too — skip it by id.
        const layout = () => $$('#scene-options-panel .section-heading:not(#scene-location-reminder), #scene-options-panel button.card')
          .map(el => text(el));

        window.gameEngine.renderScene('home_museum_relics');
        await until(() => layout().includes('Current Exhibits'), 'the wing\'s panel');
        let order = layout();
        assert(order[0].includes('Go back to'), `the exit comes first (got "${order[0]}")`);
        assert(order.indexOf('Current Exhibits') < order.indexOf('Construction'), 'contents before construction');
        assert(order[order.length - 1].includes('Install New Display Case'), `building is last (got "${order[order.length - 1]}")`);
        assert(!order.some(l => l.startsWith('+')), 'no + prefixes on the buttons');

        window.gameEngine.renderScene('home_museum');
        await until(() => layout().includes('Wings'), 'the hall\'s panel');
        order = layout();
        assert(order[0] === 'Return to Living Room', `the exit comes first (got "${order[0]}")`);
        assert(order.indexOf('Wings') < order.indexOf('Construction'), 'the wings before construction');
        assert(order[order.length - 1].includes('Build a New Wing'), `building is last (got "${order[order.length - 1]}")`);
        assert(!order.some(l => l.startsWith('+')), 'no + prefixes on the buttons');
        // Doors in slot order — the way the wings sit on the map.
        assert(order.indexOf('Enter the Armor Wing') < order.indexOf('Enter the Relic Wing'), 'slot 0 before slot 1');
      });

      await step('the hall gates building a wing on gold', async () => {
        const state = window.gameEngine.state;
        const buildBtn = () => $$('#scene-options-panel button.card').find(b => text(b).includes('Build a New Wing'));
        // The panel is built on arrival, so its affordability is re-read by
        // walking out and back in — as a player would.
        const reenterHall = async () => {
          window.gameEngine.renderScene('home_museum_armor');
          await until(() => text($('#scene-location-reminder')).includes('Armor Wing'), 'a wing');
          window.gameEngine.renderScene('home_museum');
          await until(() => buildBtn(), 'the build option in the hall');
        };

        await reenterHall();
        assert(text(buildBtn()).includes('250 Gold'), `the cost is on the button (got "${text(buildBtn())}")`);

        state.modifyPlayerStat('gold', -state.getPlayer().resources.gold);   // broke
        await reenterHall();
        assert(buildBtn().disabled, 'a museum owner with no gold cannot build');
        assert(text(buildBtn()).includes('Not enough gold'), 'and is told why');

        state.modifyPlayerStat('gold', 300);
        await reenterHall();
        assert(!buildBtn().disabled, 'affordable once the gold is there');
      });

      await step('building a wing opens a new room off the hall', async () => {
        // The button prompts for a name. A real prompt() would block the run
        // (and every tool driving it), so it is stubbed for the click and put
        // straight back — the path under test is button → prompt → action.
        const panelCard = (label) => $$('#scene-options-panel button.card').find(b => text(b).includes(label));
        const realPrompt = window.prompt;
        window.prompt = () => 'Pottery Wing';
        try {
          panelCard('Build a New Wing').click();
          await until(() => panelCard('Enter the Pottery Wing'), 'the new wing\'s door');
        } finally {
          window.prompt = realPrompt;
        }

        assert(window.gameEngine.state.getPlayer().resources.gold === 50, `250 Gold spent (left: ${window.gameEngine.state.getPlayer().resources.gold})`);
        // Slot 2 opens a second column, so the hall spans both — the map room
        // for the wing is the whole point.
        const hall = window.gameEngine.data.scenes.home_museum.mapDefinitions;
        const wing = window.gameEngine.data.scenes.home_museum_wing_2.mapDefinitions;
        assert(hall.width === 240, `the hall widened to two columns (got ${hall.width})`);
        assert(wing.left === 2760 && wing.top === 1700, `the wing sits north of column 1 (got ${wing.left},${wing.top})`);

        // A built wing behaves like the shipped ones: entering opens its panel,
        // titled with the name the player gave it, and its exit walks back out.
        panelCard('Enter the Pottery Wing').click();
        await until(() => panelCard('Install New Display Case'), 'its panel on arrival');
        assert(text($('#scene-location-reminder')).includes('Pottery Wing'), 'the panel wears the player\'s own room name');
        assert($('#scene-location-reminder .curator-scene-rep'), 'a built wing carries the reputation line');
        assert(text($('#scene-narrative')).includes('plaster is new'), 'the room describes itself as newly built');

        $$('#scene-options-panel button.card').find(b => text(b).includes('Go back to Museum Lobby')).click();
        await until(() => text($('#scene-location-reminder')).includes('Museum Lobby'), 'the hall again');
      });

      await step('a built wing survives a save/load round trip', async () => {
        const state = window.gameEngine.state;
        const save = JSON.parse(JSON.stringify(state.state));
        state.reset();                          // wipes the museum's wings
        assert(!window.gameEngine.data.scenes.home_museum_wing_2, 'a reset takes the wing off the map');

        assert(state.loadFromObject(save) === true, 'the save loads');
        const wing = window.gameEngine.data.scenes.home_museum_wing_2;
        assert(wing?.name === 'Pottery Wing', 'the wing came back with its name');
        assert(wing.mapDefinitions.left === 2760, 'and its geometry was re-derived, not stored');
        // Walk in from the house, so the hall builds its panel on arrival.
        window.gameEngine.renderScene('home_living_room');
        window.gameEngine.renderScene('home_museum');
        await until(() => $$('#scene-options-panel button.card').some(b => text(b).includes('Enter the Pottery Wing')),
          'its door in the hall again');
      });

      await step('a chosen solo fight introduces its enemy', async () => {
        // Nothing framed this encounter, so the NPC description is the only
        // thing establishing what the player is up against — it must survive.
        // Called directly: every combat *option* in the demo is multi-enemy,
        // which never shows a description anyway.
        window.gameEngine.combatSystem.startCombat(['lost_wanderer'], {});
        await until(() => $('.scene--combat'), 'the combat block to open');
        const body = $('.scene--combat .scene__description .scene__body');
        assert(body, 'a chosen fight keeps the enemy description');
        assert(text(body).includes('hollow-eyed'), `enemy described (got "${text(body)}")`);
        window.gameEngine.combatSystem.endCombat(true);   // leave combat cleanly
      });

      await step('an ambush is framed once: the scene describes it, the fight does not', async () => {
        // dungeon_corridor autoAttacks. Its description already narrates the
        // figure lunging, so the combat block must not repeat the NPC's own
        // description under it — one beat, one description, one clip.
        // The previous step left a combat block in the log, so wait for a new
        // one and assert against the newest — $() would return the first.
        const before = $$('.scene--combat').length;
        window.gameEngine.state.modifyPlayerStat('hp', 'full');   // don't die mid-assertion
        window.gameEngine.renderScene('dungeon_corridor');
        await until(() => $$('.scene--combat').length > before, 'a new combat block to open');
        const combat = $$('.scene--combat').pop();
        const block = combat.querySelector('.scene__description');
        assert(text(block).includes('Combat: Lost Wanderer'), `combat block titled (got "${text(block)}")`);
        assert(!block.querySelector('.scene__body'),
          `no enemy description in an ambush block (got "${text(block)}")`);
        // The block right before the fight — by sibling, not by index, since
        // the wanderer may append turns (or a Game Over) after it.
        assert(text(combat.previousElementSibling).includes('disheveled figure'),
          'the scene description before it did the framing');
      });

      await step('a log saved before the table rename still renders styled', async () => {
        // A save stores its narrative log as rendered HTML, so old entries carry
        // the pre-rename class names for good. Restore one and check the CSS
        // aliases still reach it — scrollback must not turn into bare tables.
        const legacy = {
          type: 'scene', title: 'Museum Armor Room',
          desc: 'An old hall.<div class="exhibits-table-container"><table class="exhibits-table">'
            + '<thead><tr><th>Display Stand</th><th>Showcased Relic</th></tr></thead>'
            + '<tbody><tr><td>Wall Shield Mount</td><td class="exhibits-table__item--empty">(Empty)</td></tr></tbody>'
            + '</table></div>',
        };
        const save = JSON.parse(JSON.stringify(window.gameEngine.state.state));
        save.log = [legacy];
        // The load path the file picker uses — it rebuilds the narrative DOM
        // from the saved log, which is the thing under test.
        assert(window.gameEngine.ui._applyLoadedSave(save) !== false, 'the legacy save loads');
        await until(() => $('#scene-narrative .exhibits-table'), 'the restored old table');

        const table = $('#scene-narrative .exhibits-table');
        const th = getComputedStyle(table.querySelector('th'));
        const td = getComputedStyle(table.querySelector('.exhibits-table__item--empty'));
        assert(th.textTransform === 'uppercase', `old headers keep their styling (got ${th.textTransform})`);
        assert(td.fontStyle === 'italic', `old empty cells keep theirs (got ${td.fontStyle})`);
        assert(parseFloat(getComputedStyle(table.querySelector('td')).paddingTop) > 0, 'and the cells keep their padding');
      });

      await step('no uncaught errors during the run', () => {
        assert(errors.length === 0, `caught: ${errors.join(' | ')}`);
      });

      report(true);
    });
  </script>
</body>

</html>
